<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Cliente - Seus Momentos</title>
    <link rel="stylesheet" href="../../css/dashboard/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="is-loading">

    <!-- Sidebar / Menu Lateral -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/login/coraçao.png" alt="Logo" onerror="this.style.display='none'">
            <span>Seus Momentos</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="#" class="active">Visão Geral</a>
            <a href="../template/index.html" id="linkEditarTemplate">Editar Site</a>
            <a href="../presentes/index.html">Lista de Presentes</a>
            <a href="../convites/index.html">Convites</a>
            <button class="btn-create" id="btnCriarNovoEvento">+ Novo Evento</button>
        </nav>

        <div class="sidebar-footer">
            <a href="../../index.html" class="logout-link">Sair</a>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="top-header">
            <div>
                <h1 id="eventoTitulo" class="skeleton-target">Meu Evento</h1>
                <p class="skeleton-target">Link do site: <a href="#" id="linkSitePublico" target="_blank">gerando...</a></p>
            </div>
            <div class="header-actions">
                <button class="btn-rescue skeleton-target" id="btnResgatarSaldo">Resgatar Saldo</button>
                <button class="btn-share skeleton-target" id="btnCopiarLink">Copiar Link</button>
            </div>
        </header>

        <!-- Cards de Estatísticas -->
        <section class="stats-grid">
            <div class="stat-card skeleton-target">
                <h3>Confirmados</h3>
                <span class="stat-value" id="statConfirmados">0</span>
            </div>
            <div class="stat-card destaque skeleton-target">
                <h3>Arrecadação Prevista</h3>
                <span class="stat-value" id="statValor">R$ 0,00</span>
            </div>
        </section>

        <!-- Tabela de Convidados -->
        <section class="guests-section">
            <div class="section-header">
                <h2 class="skeleton-target">Lista de Convidados</h2>
                <input type="text" id="buscaConvidado" class="skeleton-target" placeholder="Buscar por nome...">
            </div>
            
            <div class="table-container">
                <table class="guests-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Status</th>
                            <th>Presente(s)</th>
                            <th>Pagamento</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody id="guestsTableBody">
                        <!-- Skeletons da Tabela -->
                        <tr>
                            <td><span class="skeleton" style="width: 140px; height: 18px;"></span><br><span class="skeleton" style="width: 100px; height: 12px; margin-top: 4px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 70px; height: 18px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 120px; height: 18px;"></span></td>
                        </tr>
                        <tr>
                            <td><span class="skeleton" style="width: 120px; height: 18px;"></span><br><span class="skeleton" style="width: 90px; height: 12px; margin-top: 4px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 70px; height: 18px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 150px; height: 18px;"></span></td>
                        </tr>
                        <tr>
                            <td><span class="skeleton" style="width: 160px; height: 18px;"></span><br><span class="skeleton" style="width: 110px; height: 12px; margin-top: 4px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 70px; height: 18px;"></span></td>
                            <td><span class="skeleton" style="width: 80px; height: 20px; border-radius: 20px;"></span></td>
                            <td><span class="skeleton" style="width: 90px; height: 18px;"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Alerta -->
    <div id="alerta" class="alerta">
        <div id="alerta-icone" class="alerta-icone"></div>
        <div id="alerta-texto" class="alerta-texto"></div>
    </div>

    <script src="../../js/dashboard/script.js"></script>
</body>
</html>
