<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Seus Momentos</title>

<link rel="stylesheet" href="../../css/login/login.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-page">

  <!-- Lado esquerdo -->
  <div class="login-left">
    <h1>Seu grande dia,<br>gerenciado com amor.</h1>
    <p>Acompanhe cada detalhe do seu momento especial.</p>
  </div>

  <!-- Lado direito -->
  <div class="login-right">

    <div class="login-container">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <img src="../../assets/login/coraçao.png" alt="Logo Seus Momentos">
        </div>
        <span class="logo-text">Seus Momentos</span>
      </div>

      <!-- Header -->
      <div class="login-header">
        <h1 class="login-title">Bem-vindo de volta</h1>
        <p class="login-subtitle">
          Acesse sua conta para gerenciar seu casamento.
        </p>
      </div>

      <!-- Form -->
      <form class="login-form" id="loginForm">

        <!-- Email -->
        <div class="input-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com">
        </div>

        <!-- Senha -->
        <div class="input-group">

          <div class="password-header">
            <label for="senha">Senha</label>

            <a href="#" class="forgot-link">
              Esqueci minha senha
            </a>
          </div>

          <input type="password" id="senha" placeholder="••••••••">

        </div>

        <!-- Botão -->
        <button type="submit" class="login-button">
          Entrar
        </button>

      </form>

      <!-- Registro -->
      <p class="login-register">
        Ainda não tem uma conta?
        <a href="cadastro.html">Criar minha conta</a>
      </p>

      <!-- Footer -->
      <div class="login-footer">
        © 2026 Seus Momentos • Gestão de Casamentos
      </div>

    </div>

  </div>

</div>

<!-- ALERTA -->

<div id="alerta" class="alerta">

  <div id="alerta-icone" class="alerta-icone"></div>

  <div id="alerta-texto" class="alerta-texto"></div>

</div>

<script src="../../js/login/login.js"></script>

</body>
</html>
