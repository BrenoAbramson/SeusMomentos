<!DOCTYPE html>
<html lang="pt-br">
<head>
  <script src="/js/config.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Presentes - Seus Momentos</title>
    <link rel="stylesheet" href="../../css/dashboard/style.css">
    <link rel="stylesheet" href="../../css/presentes/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body class="is-loading">

    <!-- Sidebar / Menu Lateral -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <img src="../../assets/login/coraçao.png" alt="Logo" onerror="this.style.display='none'">
            <span>Seus Momentos</span>
        </div>
        
        <nav class="sidebar-nav">
            <a href="../dashboard/index.html">Visão Geral</a>
            <a href="../template/index.html" id="linkEditarTemplate">Editar Site</a>

        </nav>

        <div class="sidebar-footer">
            <a href="../../index.html" class="logout-link">Sair</a>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        <header class="top-header">
            <div>
                <h1 id="eventoTitulo" class="skeleton-target">Carregando evento...</h1>
                <p class="skeleton-target">Selecione abaixo quais presentes você quer disponibilizar para os convidados no seu site.</p>
            </div>
        </header>

        <!-- Container Grid de Presentes -->
        <section class="gifts-selection-section">
            <div class="selection-header">
                <h2 class="skeleton-target">Presentes Disponíveis</h2>
                <div class="selection-info">
                    <span id="giftsCount" class="skeleton-target">0 selecionados</span>
                </div>
            </div>
            
            <div class="gifts-grid-container" id="giftsGrid">
                <!-- Skeletons dos Cards de Presentes -->
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
                <div class="skeleton-gift-card">
                    <div class="skeleton skeleton-card-image"></div>
                    <div class="skeleton-card-body">
                        <div class="skeleton skeleton-card-title"></div>
                        <div class="skeleton skeleton-card-value"></div>
                        <div class="skeleton skeleton-card-button"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Alerta -->
    <div id="alerta" class="alerta">
        <div id="alerta-icone" class="alerta-icone"></div>
        <div id="alerta-texto" class="alerta-texto"></div>
    </div>

    <script src="../../js/presentes/script.js"></script>
</body>
</html>
